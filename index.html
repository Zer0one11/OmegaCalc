<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmegaCalc - Гугологический Калькулятор</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bignumber.js/9.1.2/bignumber.min.js"></script>
</head>
<body>
    <div class="calculator-container">
        <h1>ΩmegaCalc 🌌</h1>
        <div class="display">
            <input type="text" id="result" value="0"> 
            <div id="history"></div>
        </div>
        
        <div class="keypad">
            <button class="btn clear" onclick="clearDisplay()">AC</button>
            <button class="btn special" onclick="appendInput('E')">E (×10^)</button>
            <button class="btn special" onclick="appendInput('^')">^</button>
            <button class="btn operator" onclick="appendInput('/')">÷</button>

            <button class="btn gugol" onclick="appendInput('tetr(')">↑↑</button> 
            <button class="btn gugol" onclick="appendInput('pent(')">↑↑↑</button>
            <button class="btn gugol" onclick="appendInput('hex(')">↑⁴</button> <button class="btn gugol" onclick="appendInput('omega(')">$\omega$(x)</button>

            <button class="btn gugol" onclick="appendInput('ACKER(')">A(m,n)</button> <button class="btn gugol" onclick="appendInput('f_bhi(')">f(bhi)</button> <button class="btn special" onclick="appendInput('(')">(</button>
            <button class="btn special" onclick="appendInput(')')">)</button>

            <button class="btn num" onclick="appendInput('7')">7</button>
            <button class="btn num" onclick="appendInput('8')">8</button>
            <button class="btn num" onclick="appendInput('9')">9</button>
            <button class="btn operator" onclick="appendInput('*')">×</button>

            <button class="btn num" onclick="appendInput('4')">4</button>
            <button class="btn num" onclick="appendInput('5')">5</button>
            <button class="btn num" onclick="appendInput('6')">6</button>
            <button class="btn operator" onclick="appendInput('-')">-</button>

            <button class="btn num" onclick="appendInput('1')">1</button>
            <button class="btn num" onclick="appendInput('2')">2</button>
            <button class="btn num" onclick="appendInput('3')">3</button>
            <button class="btn operator" onclick="appendInput('+')">+</button>

            <button class="btn num zero" onclick="appendInput('0')">0</button>
            <button class="btn num" onclick="appendInput('.')">.</button>
            <button class="btn equal" onclick="calculate()">=</button>
        </div>
        <p class="note">⚠️ **Для $35 \times 10^{238}$ используйте $35E238$. Для функций с запятой используйте $tetr(a, b)$ и $ACKER(m, n)$.**</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
